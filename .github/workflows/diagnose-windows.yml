name: Diagnose windows tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: windows-x64 probes
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: Inbless
    steps:
      - name: Checkout pinned private submodule
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.INBLESS_READ_TOKEN }}
          submodules: recursive
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: MSVC developer environment
        shell: pwsh
        run: ./scripts/setup-msvc.ps1
      - name: Select the MSVC linker explicitly
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64/link.exe'
          if (!(Test-Path $linker)) { throw "MSVC linker missing: $linker" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
      - name: Pinned Windows protocol toolchain
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: e456309491fd875487bf02b8a0dca76c1b1b00cc
          path: Inbless/.ci-vcpkg
          persist-credentials: false
      - name: Windows native dependency cache
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: Inbless/.ci-vcpkg/installed
          key: windows-x64-vcpkg-${{ hashFiles('Inbless/config/ci/vcpkg.json') }}
      - name: Windows protocol dependencies
        shell: pwsh
        run: |
          & ./.ci-vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./.ci-vcpkg/vcpkg.exe install --triplet x64-windows --host-triplet x64-windows `
            --x-manifest-root="$pwd/config/ci" --x-install-root="$pwd/.ci-vcpkg/installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CMAKE_TOOLCHAIN_FILE=$pwd/.ci-vcpkg/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
      - name: Save completed Windows dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: Inbless/.ci-vcpkg/installed
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Build pinned SDK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build-sdk.py --protocol-deps "$PWD/.ci-vcpkg/installed/x64-windows"
      - name: Stage native runtime
        run: python scripts/stage-native.py
      - name: Probe link only error codes
        run: |
          set +e
          cargo test --workspace --locked --no-run --message-format=json > /tmp/norun.json 2> /tmp/norun.err
          echo "LINK_rc=$?"
          echo "LINK_msvc_codes=[$(grep -ohE 'LNK[0-9]{4}|LINK : fatal error' /tmp/norun.err | sort -u | tr '\n' ' ')]"
          echo "LINK_rust_codes=[$(grep -ohE 'error\[[E][0-9]{4}\]' /tmp/norun.err | sort -u | tr '\n' ' ')]"
          echo "LINK_error_lines=$(grep -cE '^(error|warning: unused)' /tmp/norun.err)"
          echo "LINK_exe_count=$(grep -oE '"executable":"[^"]+"' /tmp/norun.json | wc -l)"
          jq -r 'select(.reason == "compiler-artifact" and .executable != null) | .executable' /tmp/norun.json > /tmp/exes.txt
          echo "LINK_exe_list_lines=$(wc -l < /tmp/exes.txt)"
          echo "LINK_err_bytes=$(wc -c < /tmp/norun.err)"
      - name: Probe runtime exit codes
        run: |
          set +e
          i=0
          while IFS= read -r exe; do
            i=$((i + 1))
            [ -z "$exe" ] && continue
            "$exe" --quiet > /dev/null 2>&1
            echo "RUN_raw_$i=$?"
            PATH="$PWD/app/src-tauri/native:$PATH" "$exe" --quiet > /dev/null 2>&1
            echo "RUN_staged_$i=$?"
            python scripts/test.py --run "$exe" > /dev/null 2>&1
            echo "RUN_runner_$i=$?"
          done < /tmp/exes.txt
          echo "RUN_binaries=$i"
      - name: Probe missing dependent dlls
        run: |
          set +e
          i=0
          while IFS= read -r exe; do
            i=$((i + 1))
            [ -z "$exe" ] && continue
            dumpbin /dependents "$exe" 2> /dev/null | grep -ohiE '[a-z0-9_.-]+\.dll' | sort -u > /tmp/deps.txt
            echo "DLL_exe_$i_deps=$(wc -l < /tmp/deps.txt)"
            while IFS= read -r d; do
              if [ ! -e "app/src-tauri/native/$d" ] && [ ! -e "C:/Windows/System32/$d" ]; then
                echo "DLL_exe_${i}_MISSING=$d"
              fi
            done < /tmp/deps.txt
          done < /tmp/exes.txt
          for dll in app/src-tauri/native/*.dll; do
            n=$(basename "$dll")
            dumpbin /dependents "$dll" 2> /dev/null | grep -ohiE '[a-z0-9_.-]+\.dll' | sort -u > /tmp/deps2.txt
            while IFS= read -r d; do
              if [ ! -e "app/src-tauri/native/$d" ] && [ ! -e "C:/Windows/System32/$d" ]; then
                echo "DLL_transitiveness_${n}_MISSING=$d"
              fi
            done < /tmp/deps2.txt
          done
          echo "DLL_staged_count=$(ls app/src-tauri/native/*.dll 2> /dev/null | wc -l)"
      - name: Probe full suite shape
        run: |
          set +e
          python scripts/test.py > /tmp/t.out 2>&1
          echo "SUITE_testpy_rc=$?"
          echo "SUITE_ok=$(grep -c '\.\.\. ok' /tmp/t.out)"
          echo "SUITE_failed=$(grep -c '\.\.\. FAILED' /tmp/t.out)"
          echo "SUITE_ignored=$(grep -c '\.\.\. ignored' /tmp/t.out)"
          echo "SUITE_result_lines=$(grep -c 'test result' /tmp/t.out)"
          echo "SUITE_panics=$(grep -c 'panicked' /tmp/t.out)"
          echo "SUITE_crash_markers=$(grep -ciE 'abort|access violation|stack overflow|unhandled|0xc0000' /tmp/t.out)"
          echo "SUITE_out_bytes=$(wc -c < /tmp/t.out)"
          echo "SUITE_asset_bytes=$(wc -c < test/Screenshot_2025-08-03-02-18-04-944_com.nianticproject.ingress.jpg)"
          echo "SUITE_weight_bytes=$(wc -c < weights/best.onnx)"
