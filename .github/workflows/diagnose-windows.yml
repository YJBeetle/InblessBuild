name: Diagnose windows tests

on:
  workflow_dispatch:
  push:
    branches: ['ci/diagnose-windows']

permissions:
  contents: read

jobs:
  diagnose:
    name: windows-x64 probes
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: Inbless
    steps:
      - name: Checkout pinned private submodule
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.INBLESS_READ_TOKEN }}
          submodules: recursive
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: MSVC developer environment
        shell: pwsh
        run: ./scripts/setup-msvc.ps1
      - name: Select the MSVC linker explicitly
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64/link.exe'
          if (!(Test-Path $linker)) { throw "MSVC linker missing: $linker" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
      - name: Pinned Windows protocol toolchain
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: e456309491fd875487bf02b8a0dca76c1b1b00cc
          path: Inbless/.ci-vcpkg
          persist-credentials: false
      - name: Windows native dependency cache
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: Inbless/.ci-vcpkg/installed
          key: windows-x64-vcpkg-${{ hashFiles('Inbless/config/ci/vcpkg.json') }}
      - name: Windows protocol dependencies
        shell: pwsh
        run: |
          & ./.ci-vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./.ci-vcpkg/vcpkg.exe install --triplet x64-windows --host-triplet x64-windows `
            --x-manifest-root="$pwd/config/ci" --x-install-root="$pwd/.ci-vcpkg/installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CMAKE_TOOLCHAIN_FILE=$pwd/.ci-vcpkg/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
      - name: Save completed Windows dependencies
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: Inbless/.ci-vcpkg/installed
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Build pinned SDK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build-sdk.py --protocol-deps "$PWD/.ci-vcpkg/installed/x64-windows"
      - name: Stage native runtime
        run: python scripts/stage-native.py
      - name: Run test-execution probe
        run: python ../scripts/probe-windows-tests.py
